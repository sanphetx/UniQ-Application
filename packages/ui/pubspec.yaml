name: ui
description: "UI package for Flutter application"
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  another_flushbar: ^1.12.30
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  remixicon: ^1.4.1
  flutter_gen: ^5.10.0
  flutter_bloc: ^8.1.3
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.2.0
  go_router: ^16.2.0
  intl_utils: ^2.8.8
  google_fonts: ^6.1.0
  equatable: ^2.0.5
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2


dev_dependencies:
  flutter_gen_runner: ^5.10.0
  build_runner: ^2.7.2
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/animations/
    - assets/videos/
  fonts:
    - family: SukhumvitSet
      fonts:
        - asset: ./assets/fonts/SukhumvitSet-Thin.ttf
          weight: 100
        - asset: ./assets/fonts/SukhumvitSet-Light.ttf
          weight: 300
        - asset: ./assets/fonts/SukhumvitSet-Text.ttf
          weight: 400
        - asset: ./assets/fonts/SukhumvitSet-Medium.ttf
          weight: 500
        - asset: ./assets/fonts/SukhumvitSet-SemiBold.ttf
          weight: 600
        - asset: ./assets/fonts/SukhumvitSet-Bold.ttf
          weight: 700

flutter_gen:
  output: ./lib/src/generated

flutter_intl:
  enabled: true
  main_locale: th
  class_name: UILocalizations
  arb_dir: lib/src/localization
  output_dir: lib/src/generated
